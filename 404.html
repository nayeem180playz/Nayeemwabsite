<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page not found | Nayeem Hossen</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7ef;--ink:#111;--mute:#777;--lime:#7ae12b;--card:#fff;--line:#ecebe0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--ink:#f2f2ec;--mute:#9aa2b1;--card:#171c27;--line:#232a38}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6}
.box{max-width:520px;width:100%;text-align:left}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:34px;color:inherit;text-decoration:none}
.logo b{background:var(--lime);color:#111;border-radius:8px;padding:2px 9px;font-weight:800}
.hand{font-family:Caveat,cursive;color:var(--lime);font-size:30px;display:block;line-height:1.1}
h1{font-size:clamp(72px,22vw,128px);font-weight:800;letter-spacing:-4px;line-height:1}
h2{font-size:clamp(24px,6vw,32px);margin:6px 0 10px}
p{color:var(--mute);font-size:15px;margin-bottom:26px;max-width:420px}
.row{display:flex;gap:10px;flex-wrap:wrap}
a.btn{display:inline-block;padding:13px 26px;border-radius:30px;font-weight:600;font-size:15px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none}
a.btn.p{background:var(--lime);border-color:var(--lime);color:#111}
a.btn:hover{transform:translateY(-2px)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<main class="box">
<a class="logo" href="/"><b>N</b>Nayeem Hossen</a>
<span class="hand">Oops!</span>
<h1>404</h1>
<h2>Page not found</h2>
<p>The page you are looking for does not exist, was moved, or is hidden. Check the link, or go back to the home page.</p>
<div class="row"><a class="btn p" href="/">Go to Home</a><a class="btn" href="/#projects">Projects</a><a class="btn" href="/#blog">Blog</a></div>
</main>
</body>
</html>
