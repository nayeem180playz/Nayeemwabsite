[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["index.html"]

# Pages that need server-side SEO tags
# Home page: the static index.html is served (safe even if functions are not deployed).
# To also fill the home page tags on the server, add "force = true" below after you confirm the functions work.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/page"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/page"
  status = 200
  force = true

[[redirects]]
  from = "/project/*"
  to = "/.netlify/functions/page"
  status = 200
  force = true

[[redirects]]
  from = "/app/*"
  to = "/.netlify/functions/page"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
